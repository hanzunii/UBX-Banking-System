# Server binding
server.address=0.0.0.0
server.port=8080

# Embedded H2 database (works out of the box, file persisted)
spring.datasource.url=jdbc:h2:file:./data/atmbank
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Bootstrap demo accounts + create schema
app.demo-data=true

# JWT configuration
app.jwt.secret=change-this-secret-in-production-use-a-long-random-string-0123456789abcdef
app.jwt.expiration-ms=86400000

# Rate limiting (max attempts per account per window)
app.rate-limit.max-attempts=5
app.rate-limit.window-minutes=15

# CORS for any origin (mobile app does not enforce CORS, but kept for browser testing)
app.cors.allowed-origins=*

# Logging
logging.level.com.atm=INFO
