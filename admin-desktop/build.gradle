plugins {
    id 'java'
    id 'application'
}

group = 'com.atm'
version = '1.0.0'

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

application {
    mainClass = 'com.atm.admin.AdminApp'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.json:json:20240303'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.atm.admin.AdminApp'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
