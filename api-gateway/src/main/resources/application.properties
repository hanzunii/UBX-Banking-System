# Gateway server
server.port=8080

# RMI registry connection (points to the RMI Core Server)
rmi.host=localhost
rmi.port=1099

# Zero-config discovery - lets the mobile app find this gateway over DHCP
# without a hard-coded IP. The gateway answers a UDP probe on discovery.port
# with the LAN URL it is reachable on right now. Leave advertise-host empty to
# auto-detect the LAN address; set it only if the phone cannot reach the NIC.
discovery.enabled=true
discovery.port=45560
discovery.advertise-host=
app.version=2.0.0

# JWT - must match the RMI Core Server exactly so gateway can validate its tokens
jwt.secret=super-secret-change-in-production-use-at-least-256-bits-for-hs256!!
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# Logging
logging.level.com.atm.gateway=DEBUG