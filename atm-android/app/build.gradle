plugins {
    id 'com.android.application'
}

android {
    namespace 'com.atm.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.atm.mobile"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.4"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('ATM_KEYSTORE') ?: '/tmp/atm-release-key.jks')
            storePassword System.getenv('ATM_KEYSTORE_PASS') ?: 'atm12345'
            keyAlias System.getenv('ATM_KEY_ALIAS') ?: 'atm-release'
            keyPassword System.getenv('ATM_KEY_PASS') ?: 'atm12345'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
